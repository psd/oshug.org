            <h3 id="workshops">Sunday :: Workshops</h3>

            <h4>Practising the use of LLMs with open source electronics projects</h4>
            <p id="LLMWorkshop">This workshop will explore some hands-on use of some of the emerging tools, LLMs and strategies for using them in the engineering space. We will play with some of what is already available, and explore exciting possibilities on the horizon. We will also discuss common challenges that we need to overcome including pitfalls, risks and limitations. So, if you are practicing hardware/firmware engineer, or hobbyist this workshop gives you an opportunity to tinker with the OSHW future.</p>

            <p>Participants should bring:</p>
            <p><ul><li>A laptop.</li></ul></p>
            <p>Hosted by: <a href="#AlanWood">Alan Wood</a>.</p>

            <h4>Retro Computing Simulation</h4>
            <p id="RetroComputingSimulation">Some of us hanker after an original minicomputer with all the switches and lights but no longer have access to the hardware. Indeed, few of us have the space required to recreate installations from those early days when disk drives were the size of washing machines!<p>
            <p>There are excellent software emulations of many of these early systems, but the excitement of operating a functioning front panel cannot be beaten!</p>
            <p>We expect to be demonstrating the following running replicas:
            <ul>
            <li>Wireless World Computer</li>
            <li>Raspberry Pi based PDP-1, PDP-8, PDP-11 and the PDP-10</li>
            <li>FPGA-based LGP-30</li>
            <li>FPGA-based PDP-8</li>
            <li>IMSAI 8080</li></ul></p>
            <p>We will show the systems running and welcome user interaction. So, get out the old CP/M handbook and the DEC Introduction to Programming and off we go!</p>
            <p>Participants should bring:</p>
            <p><ul><li>A laptop.</li></ul></p>
            <p>Hosted by: <a href="#KevinMurrell">Kevin Murrell</a>.</p>

            <h4>The Project Salon</h4>
            <p id="ProjectSalon">The project salon is part show and tell and part project clinic, which will provide an opportunity to discuss projects and share skills and experience with fellow OSHCamp delegates. For example, this might be showing off your latest creation, sharing details of a neat hack, or seeking advice on a particularly tricky problem which has brought your project to a standstill.</p>

            <p>Rod Moody will be bringing along Raftabar — the autonomous robot which made its debut at OSHCamp 2024 — and sharing details of numerous upgrades made over the past few years.</p>

            <p>Short presentations are welcome and if using slides these should be in PDF or OpenDocument Presentation format.</p>

            <p>Participants should optionally bring:</p>
            <p><ul>
            <li>A project. Exercise common sense! E.g. nothing large or dangerous etc.</li>
            <li>Slides (PDF or OpenDocument Presentation format).</li>
            </ul></p>
            <p>Hosted by:</p>

            <p><a href="#AndyBennett">Andy Bennett</a> and <a href="#RodMoody">Rod Moody</a>.</p>

